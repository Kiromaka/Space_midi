[project]
name = "spacemidi"
version = "0.1.0"
description = "Space MIDI core: audio mix to multi-track MIDI"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Own neural networks (L2). The CUDA build of PyTorch comes from the index below.
nn = ["torch>=2.6"]

[project.scripts]
spacemidi = "spacemidi.cli:main"

[dependency-groups]
# Tests, metrics and reference comparisons only, never inside core algorithms.
dev = [
    "pytest>=8",
    "librosa>=0.10",
    "mido>=1.3",
    "mir_eval>=0.7",
    "jsonschema>=4.21",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spacemidi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
